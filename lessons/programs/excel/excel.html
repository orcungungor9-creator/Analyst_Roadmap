<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel | My Analyst LogBook</title>
    <!-- Core styles -->
    <link rel="stylesheet" href="../../../styles.css">
    <!-- Component styles -->
    <link rel="stylesheet" href="../../../css/components.css">
    <!-- Local styles -->
    <link rel="stylesheet" href="../Notes/program-layout.css">
    <link rel="stylesheet" href="excel.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" integrity="sha384-cPFV+/abYd3INVFHPmSKpBmcnH+Q+bTZW7dv/EiuShUNPkHyFmRF8PsL7Ibfvunk" crossorigin="anonymous"></script>
    <style>
        .page-header {
            padding: 80px 24px 40px;
            text-align: center;
        }
        .page-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            color: var(--text-main);
        }
        .page-content {
            min-height: 50vh;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="excel-page" style="display: flex; flex-direction: column; min-height: 100vh;">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('analyst_theme') || 'theme-light-purple';
            if (savedTheme !== 'theme-dark') {
                document.body.classList.add(savedTheme);
            }
        })();
    </script>
    
        <main style="flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 40px 24px 60px;">
    <div class="program-layout-wrapper">
        <div class="left-column">
        <div class="program-hero">
            <div class="program-header">
                <div class="program-logo">
                    <img loading="lazy" src="../../../assets/logos/excel-logo.svg" alt="Excel Logo">
                </div>
                <h1 class="program-title">Excel</h1>
            </div>
            <p class="program-description">Açıklama metni buraya gelecek...</p>
        </div>

        <div class="program-accordion-container">
            <div class="accordion-item">
                <div class="accordion-header">
                    <h3 class="accordion-title">Ders 1 İsim</h3>
                    <div class="accordion-icon"><i class="ph ph-caret-down"></i></div>
                </div>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        Ders 1 içeriği buraya gelecek...
                    </div>
                </div>
            </div>
            
            <div class="accordion-item">
                <div class="accordion-header">
                    <h3 class="accordion-title">Ders 2 İsim</h3>
                    <div class="accordion-icon"><i class="ph ph-caret-down"></i></div>
                </div>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        Ders 2 içeriği buraya gelecek...
                    </div>
                </div>
            </div>
        </div>
            </div> <!-- End of left-column -->
        
        <div class="right-column">
            <h2 class="notepad-title">Kodlarım</h2>
            <p class="notepad-instructions">Bu kısma istediğiniz gibi not tutabilir ve ardından notunuzu kopyalayabilirsiniz.</p>
                                                <div class="notepad-tools">
                <div class="notepad-tool-group">
                    <span class="pen-label"><i class="ph ph-palette"></i> Renk:</span>
                    <div class="pen-colors">
                        <button class="pen-color-btn" data-color="var(--text-main)" style="background: #ffffff; border: 1px solid #ccc;"></button>
                        <button class="pen-color-btn" data-color="#FF5252" style="background: #FF5252;"></button>
                        <button class="pen-color-btn" data-color="#4CAF50" style="background: #4CAF50;"></button>
                                                <button class="pen-color-btn" data-color="#111111" style="background: #111111;"></button>
                        <button class="pen-color-btn" data-color="#9C27B0" style="background: #9C27B0;"></button>
                        <button class="pen-color-btn" data-color="#E91E63" style="background: #E91E63;"></button>
                        <button class="pen-color-btn" data-color="var(--theme-color)" style="background: var(--theme-color);"></button>
                    </div>
                </div>
                <div class="notepad-tool-group">
                    <span class="pen-label"><i class="ph ph-text-aa"></i> Boyut:</span>
                    <div class="font-sizes">
                        <button class="font-btn" data-action="6" style="font-weight:bold; font-size:1.1rem;">Büyük</button>
                        <button class="font-btn" data-action="5" style="font-weight:600; font-size:0.95rem;">Orta</button>
                        <button class="font-btn" data-action="3" style="font-weight:normal; font-size:0.85rem;">Küçük</button>
                    </div>
                </div>
            </div>
            <div class="notepad-textarea" contenteditable="true" placeholder="Buraya yazın..."></div>
            <div class="notepad-actions">
                <button class="notepad-copy-btn">Kopyala <i class="ph ph-copy"></i></button>
                <button class="notepad-clear-btn">Temizle <i class="ph ph-trash"></i></button>
            </div>
        </div>
    </div> <!-- End of program-layout-wrapper -->
</main>

    <!-- Components injects header, footer, modals -->
    <script src="../../../js/components.js"></script>
    <script src="../../../js/nav.js"></script>
    <script src="../../../js/modal.js"></script>
    <script src="../../../js/script.js"></script>
    <script src="../Notes/program-layout.js"></script>
    <script src="excel.js"></script>
</body>
</html>
