<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Mimarisi | Analyst Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('analyst_theme') || 'theme-light-purple';
            if (savedTheme !== 'theme-dark') {
                document.body.classList.add(savedTheme);
            }
        })();
    </script>

    <!-- Header injected via components.js -->

    <!-- HERO BANNER -->
    <div class="hero-banner-wrapper">
        <div class="hero-banner-bg"></div>
        <div class="hero-banner-overlay"></div>
        <section class="hero-section" style="align-items: flex-start; padding-top: 100px; padding-bottom: 60px;">
            <div class="hero-content">
                <div class="badge-pill" style="background: var(--neon-blue); color: #fff;">Veri Mimarisi</div>
                <h1 class="hero-title custom-brand-title" style="font-size: 3.5rem;">Modern Veri Mimarisi</h1>
                <p class="hero-subtitle">
                    Büyük veri sistemlerinin nasıl tasarlandığını, veri gölleri, veri ambarları ve pipeline süreçlerini öğrenin. Veriyi nasıl taşıyıp depolayacağınızı keşfedin.
                </p>
            </div>
        </section>
    </div>

    <!-- MAIN CONTENT (NO GLASSMORPHISM) -->
    <main class="solid-main-container">
        <!-- İçerik daha sonra eklenecek -->
    </main>

    <!-- Footer injected via components.js -->

    <!-- Scripts -->
    <script src="../js/components.js"></script>
    <script src="../js/nav.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
