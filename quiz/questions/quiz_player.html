<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ekranı</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="quiz_player.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="formulas-page">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('analyst_theme');
            if (savedTheme && savedTheme !== 'theme-dark') {
                document.body.classList.add(savedTheme);
            }
        })();
    </script>

    <div class="quiz-layout">
        <main class="quiz-main">
            <h1 class="quiz-main-title" id="main-title">Yükleniyor...</h1>
            <div class="quiz-card">
                <div class="question-area" id="question-text">Soru alanı...</div>
                <div class="divider"></div>
                <div class="options-area" id="options-container">
                    <!-- Butonlar JS ile gelecek -->
                </div>
            </div>
        </main>
        
        <aside class="quiz-sidebar">
            <div class="sidebar-menu">
                <button class="stat-pill red-pill back-btn" onclick="window.history.back()">
                    <i class="fa-solid fa-arrow-left icon-left"></i>
                    <span class="pill-text">Geri Dön</span>
                </button>
                
                <div class="stat-pill" id="difficulty-badge">
                    <span class="diff-dot" id="diff-dot"></span>
                    <span class="pill-text" id="difficulty-text">Yükleniyor...</span>
                </div>
                
                <div class="stat-pill purple-pill">
                    <i class="fa-solid fa-list-check icon-left"></i>
                    <span class="pill-text">Soru: <span id="questions-left">0 / 0</span></span>
                </div>
                
                <div class="stat-pill blue-pill">
                    <i class="fa-solid fa-percent icon-left"></i>
                    <span class="pill-text">Başarı: <span id="success-rate">%0</span></span>
                </div>
            </div>
        </aside>
    </div>

    <script src="../../js/components.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/modal.js"></script>
    <script src="../../js/script.js"></script>
    <script src="quiz_player.js"></script>
</body>
</html>
