<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakkımda | Analyst Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="about.css">
</head>
<body>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('analyst_theme') || 'theme-light-purple';
            if (savedTheme !== 'theme-dark') {
                document.body.classList.add(savedTheme);
            }
        })();
    </script>

    <main class="main-container" style="max-width: 100% !important; padding: 0 !important; width: 100%; min-height: calc(100vh - 100px);">
        <div class="about-container">
            <!-- Banner Section -->
            <div class="about-banner-wrapper">
                <div class="about-banner">
                    <span class="banner-brand-text">ANALYST ROADMAP</span>
                </div>
            </div>

            <div class="about-inner-content">
                <div class="about-profile-section">
                    <div class="profile-image-container">
                        <img src="Orcun_Gungor.png" alt="Orçun Güngör" class="profile-image">
                    </div>
                    <div class="profile-info-row">
                        <div class="profile-socials">
                            <a href="https://www.linkedin.com/in/or%C3%A7un-g%C3%BCng%C3%B6r-720327353/" target="_blank" class="social-btn linkedin-btn" title="LinkedIn">
                                <i class="ph ph-linkedin-logo"></i>
                            </a>
                            <a href="mailto:analystroadmap0@gmail.com" class="social-btn mail-btn" title="E-Posta">
                                <i class="ph ph-envelope-simple"></i>
                            </a>
                        </div>
                        <h1 class="profile-name">Orçun Güngör</h1>
                    </div>
                </div>
                <!-- Neden Kuruldu Section -->
                <div class="about-why-box">
                    <h2>Analyst Roadmap Neden Kuruldu ?</h2>
                    <div id="neden-kuruldu-content">
                        <p class="about-placeholder-text">Yazı metni buraya eklenecektir...</p>
                    </div>
                </div>

                <!-- Vizyon ve Misyon Cards -->
                <div class="about-cards-container">
                    <div class="about-card neon-frame-blue">
                        <h3>Vizyonum</h3>
                        <div id="vizyon-content">
                            <p class="about-placeholder-text">Vizyon metni buraya eklenecektir...</p>
                        </div>
                    </div>
                    <div class="about-card neon-frame-green">
                        <h3>Misyonum</h3>
                        <div id="misyon-content">
                            <p class="about-placeholder-text">Misyon metni buraya eklenecektir...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/components.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/script.js"></script>
    <script src="about.js"></script>
</body>
</html>
