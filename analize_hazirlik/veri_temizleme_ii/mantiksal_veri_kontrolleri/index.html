<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantıksal Veri Kontrolleri | Analyst Roadmap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../../css/styles.css">
    <link rel="stylesheet" href="../../../css/components.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-brand-title {
            background: linear-gradient(135deg, #f43f5e, #fda4af);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="formulas-page">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('analyst_theme') || 'theme-light-purple';
            if (savedTheme !== 'theme-dark') {
                document.body.classList.add(savedTheme);
            }
        })();
    </script>

    <!-- DİNAMİK ARKA PLAN GRAFİK AĞI (BG ANALYTICS MESH) -->
    <div class="bg-analytics-mesh" style="animation: none !important; transition: none !important; pointer-events: none;">
        <!-- SVG 1: İniş Çıkış Trend Çizgisi -->
        <div class="bg-chart-item bg-chart-1" style="animation: none !important;">
            <svg viewBox="0 0 400 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg-area-grad-1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--neon-blue)" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="var(--neon-blue)" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
                <path d="M 10,180 Q 70,120 130,150 T 250,90 T 370,40 L 370,190 L 10,190 Z" fill="url(#bg-area-grad-1)" />
                <path d="M 10,180 Q 70,120 130,150 T 250,90 T 370,40" fill="none" stroke="var(--neon-blue)" stroke-width="4" stroke-linecap="round" />
                <circle cx="130" cy="150" r="6" fill="var(--neon-green)" />
                <circle cx="250" cy="90" r="6" fill="var(--neon-purple)" />
                <circle cx="370" cy="40" r="8" fill="var(--neon-blue)"></circle>
            </svg>
        </div>

        <!-- SVG 2: Pasta / Donut Grafiği -->
        <div class="bg-chart-item bg-chart-2" style="animation: none !important;">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(100,100)">
                    <path d="M 0,-80 A 80,80 0 0,1 76,25 L 57,18 A 60,60 0 0,0 0,-60 Z" fill="var(--neon-blue)" />
                    <path d="M 76,25 A 80,80 0 0,1 -64,48 L -48,36 A 60,60 0 0,0 57,18 Z" fill="var(--neon-green)" />
                    <path d="M -64,48 A 80,80 0 0,1 0,-80 L 0,-60 A 60,60 0 0,0 -48,36 Z" fill="var(--neon-purple)" />
                    <circle cx="0" cy="0" r="45" fill="none" stroke="var(--glass-border)" stroke-width="2" stroke-dasharray="5,5" />
                </g>
            </svg>
        </div>

        <!-- SVG 3: Sütun Grafiği -->
        <div class="bg-chart-item bg-chart-3" style="animation: none !important;">
            <svg viewBox="0 0 250 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <line x1="20" y1="50" x2="230" y2="50" stroke="var(--glass-border)" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="20" y1="100" x2="230" y2="100" stroke="var(--glass-border)" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="20" y1="150" x2="230" y2="150" stroke="var(--glass-border)" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="20" y1="200" x2="230" y2="200" stroke="var(--glass-border)" stroke-width="2" />
                <rect x="35" y="120" width="30" height="80" rx="6" fill="var(--neon-blue)"></rect>
                <rect x="85" y="70" width="30" height="130" rx="6" fill="var(--neon-green)"></rect>
                <rect x="135" y="150" width="30" height="50" rx="6" fill="var(--neon-purple)"></rect>
                <rect x="185" y="90" width="30" height="110" rx="6" fill="var(--neon-blue)"></rect>
            </svg>
        </div>

        <!-- SVG 4: Mum Grafiği -->
        <div class="bg-chart-item bg-chart-4" style="animation: none !important;">
            <svg viewBox="0 0 280 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <line x1="50" y1="30" x2="50" y2="170" stroke="var(--neon-green)" stroke-width="3" />
                <rect x="38" y="70" width="24" height="60" rx="4" fill="var(--neon-green)" />
                <line x1="110" y1="50" x2="110" y2="190" stroke="var(--neon-blue)" stroke-width="3" />
                <rect x="98" y="90" width="24" height="70" rx="4" fill="var(--neon-blue)" />
                <line x1="170" y1="20" x2="170" y2="150" stroke="var(--neon-purple)" stroke-width="3" />
                <rect x="158" y="50" width="24" height="50" rx="4" fill="var(--neon-purple)" />
                <line x1="230" y1="60" x2="230" y2="200" stroke="var(--neon-green)" stroke-width="3" />
                <rect x="218" y="100" width="24" height="55" rx="4" fill="var(--neon-green)" />
            </svg>
        </div>
    </div>

    <!-- Full-Viewport Hero Banner -->
    <div class="prep-banner-wrapper" style="border-bottom-color: #f43f5e !important;">
        <div class="prep-banner-bg"></div>
        <div class="prep-banner-overlay"></div>
        <section class="hero-section" style="align-items: flex-start; padding-top: 100px; padding-bottom: 50px;">
            <div class="hero-content">
                <div class="badge-pill" style="background: rgba(244, 63, 94, 0.15); color: #f43f5e; border-color: rgba(244, 63, 94, 0.3);">Veri Temizleme II</div>
                <h1 class="hero-title custom-brand-title" style="font-size: 3rem;">Mantıksal Veri Kontrolleri</h1>
                <p class="hero-subtitle">
                    Yakında eklenecek içerik bu alanda yer alacaktır.
                </p>
                <button class="btn-hero btn-hero-prep" onclick="window.location.href='../../index.html#veri-temizleme-ii'" style="margin-top: 16px;">
                    <i data-lucide="arrow-left" style="width: 18px; height: 18px; margin-right: 8px;"></i>
                    Analize Hazırlık Sayfasına Dön
                </button>
            </div>
        </section>
    </div>

    <main style="max-width: 1200px; width: 100%; margin: 40px auto 100px auto; padding: 0 40px;">
        <div class="info-card-box glass-card lazy-fade" style="margin-top: 40px; padding: 40px;">
            <div style="text-align: center; color: var(--text-muted); font-size: 1.2rem;">
                <i data-lucide="construction" style="width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5;"></i>
                <p>Bu bölüm yapım aşamasındadır. Detaylı teknik içerik eklenecektir.</p>
            </div>
        </div>
    </main>

    <script src="../../../js/components.js"></script>
    <script src="../../../js/nav.js"></script>
    <script src="../../../js/modal.js"></script>
    <script src="../../../js/script.js"></script>
    <script src="script.js"></script>
</body>
</html>
